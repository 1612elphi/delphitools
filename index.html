<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <title>delphitools</title>
    <meta name="description" content="A collection of small, low stakes and low effort tools. No logins, no registration, no data collection. Everything runs locally in your browser.">
    <meta property="og:type" content="website">
    <meta property="og:site_name" content="delphitools">
    <meta property="og:title" content="delphitools — privacy-first browser tools">
    <meta property="og:description" content="A collection of small, low stakes and low effort tools. No logins, no registration, no data collection. Everything runs locally in your browser.">
    <meta property="og:image" content="https://delphi.tools/og.png">
    <meta property="og:image:width" content="1200">
    <meta property="og:image:height" content="630">
    <meta property="og:image:alt" content="delphitools hero image">
    <meta name="twitter:card" content="summary_large_image">
    <meta name="twitter:title" content="delphitools — privacy-first browser tools">
    <meta name="twitter:description" content="A collection of small, low stakes and low effort tools. No logins, no registration, no data collection. Everything runs locally in your browser.">
    <meta name="twitter:image" content="https://delphi.tools/og.png">
    <meta name="twitter:image:alt" content="delphitools hero image">
    <meta name="twitter:image:width" content="1200">
    <meta name="twitter:image:height" content="630">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <link rel="icon" href="/delphi-lowlod.png">

    <script>
      (function () {
        try {
          var t = localStorage.getItem('theme');
          if (t === 'dark' || (t !== 'light' && matchMedia('(prefers-color-scheme:dark)').matches)) {
            document.documentElement.classList.add('dark');
          }
        } catch (e) {}
      })();
    </script>

    {{content-for "head"}}

    <link integrity="" rel="stylesheet" href="/@embroider/virtual/vendor.css">

    {{content-for "head-footer"}}
  </head>
  <body>
    {{content-for "body"}}

    <script src="/@embroider/virtual/vendor.js"></script>
    <script type="module">
      import Application from './app/app';
      import environment from './app/config/environment';

      Application.create(environment.APP);
    </script>

    {{content-for "body-footer"}}
  </body>
</html>
